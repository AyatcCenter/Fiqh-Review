<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نبراس مادة عباداتي</title>
  <style>
    body {
      background-color: #fbf9f4;
      color: #1f2d3d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 15px;
      direction: rtl;
      text-align: right;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .brand-title {
      font-size: 32px;
      font-weight: 900;
      color: #0b4f8a;
      margin: 0;
    }
    .brand-slogan {
      font-size: 14px;
      color: #536b88;
      font-weight: bold;
      margin-top: 4px;
    }
    .subject-badge {
      display: inline-block;
      background: #f5a623;
      color: #fff;
      padding: 5px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 15px;
      margin-top: 8px;
    }
    .card {
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      border: 3px solid #eef4fb;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .btn {
      background: #0b4f8a;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 12px 24px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin: 6px 4px;
    }
    .btn:hover {
      background: #083863;
    }
    .btn-retry {
      background: #f5a623 !important;
    }
    .btn-exit-quiz {
      background: #fff0f0;
      color: #c0392b;
      border: 2px solid #f5c6cb;
      border-radius: 12px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .btn-exit-quiz:hover {
      background: #f8d7da;
      border-color: #e74c3c;
    }
    .btn-next-action {
      background: #0b4f8a;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 11px 26px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(11, 79, 138, 0.2);
    }
    .btn-next-action:hover {
      background: #083863;
    }
    .input-text {
      width: 75%;
      padding: 12px 18px;
      font-size: 18px;
      border: 2px solid #ccdcee;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      color: #052c52;
      outline: none;
      margin-bottom: 15px;
    }
    .gender-selector {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 18px;
    }
    .gender-btn {
      background: #f0f4f8;
      border: 2px solid #ccdcee;
      border-radius: 14px;
      padding: 10px 22px;
      font-size: 16px;
      font-weight: bold;
      color: #486581;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .gender-btn.active {
      border-color: #0b4f8a;
      background: #e2ebf3;
      color: #0b4f8a;
      box-shadow: 0 3px 8px rgba(11, 79, 138, 0.15);
    }
    .lessons-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 15px;
    }
    @media (min-width: 500px) {
      .lessons-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    .lesson-item {
      background: #fdfefe;
      border: 2px solid #ddecfa;
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
    }
    .lesson-item:hover {
      border-color: #0b4f8a;
      background: #f4f8fd;
    }
    .lesson-item.passed {
      border-color: #27ae60;
      background: #f4fbf7;
    }
    .lesson-item.need-retry {
      border-color: #f5a623;
      background: #fffdf9;
    }
    .progress-bar-bg {
      width: 120px;
      height: 12px;
      background: #e2ebf3;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #27ae60;
      transition: width 0.3s;
    }
    .opt-btn {
      width: 100%;
      background: #fff;
      border: 2px solid #dce8f5;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      text-align: right;
      cursor: pointer;
      margin-bottom: 10px;
      display: block;
    }
    .opt-btn:hover:not(:disabled) {
      background: #f0f7ff;
      border-color: #0b4f8a;
    }
    .opt-btn.correct {
      background: #d4edda !important;
      border-color: #27ae60 !important;
      color: #155724 !important;
    }
    .opt-btn.wrong {
      background: #f8d7da !important;
      border-color: #e74c3c !important;
      color: #721c24 !important;
    }
  </style>
</head>
<body>

  <div class="header">
    <div style="font-size: 36px; color: #f5a623;">☀</div>
    <h1 class="brand-title">نِبْرَاس</h1>
    <div class="brand-slogan">جِيلٌ يَهْتَدِي بِالوَحْيِ فِي غَسَقِ الفِتَن</div>
    <div class="subject-badge">مادة عباداتي</div>
  </div>

  <div class="card">
    
    <!-- 1. شاشة البداية -->
    <div id="loginScreen" style="display: block; text-align: center; padding: 15px 0;">
      <h2 style="color: #052c52; margin-bottom: 10px;">أهلاً بكم في رحلة الفقه الممتعة! 🌟</h2>
      <p style="color: #627d98; font-weight: bold; margin-bottom: 15px;">اختر من أنت واكتب اسمك الكريم:</p>
      
      <div class="gender-selector">
        <button type="button" class="gender-btn active" id="genderBoy" onclick="setGender('boy')">👦 بطل</button>
        <button type="button" class="gender-btn" id="genderGirl" onclick="setGender('girl')">👧 بطلة (أميرتنا الغالية)</button>
      </div>

      <input type="text" id="studentNameInput" class="input-text" placeholder="اكتب اسمك هنا...">
      <br>
      <button type="button" class="btn" onclick="startAdventure()">انطلاق 🚀</button>
    </div>

    <!-- 2. خريطة الدروس -->
    <div id="mapScreen" style="display: none;">
      <div style="background: #fff2d6; border: 2px dashed #f5a623; border-radius: 16px; padding: 12px; text-align: center; font-size: 17px; font-weight: bold; color: #052c52;">
        <span id="displayGreeting"></span>: <span id="displayName" style="color: #0b4f8a;"></span> ✨
      </div>
      <div class="lessons-grid" id="lessonsGrid"></div>
      <div style="text-align: center; margin-top: 20px;" id="finalCertBtnArea"></div>
    </div>

    <!-- 3. شاشة الاختبار -->
    <div id="quizScreen" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #edf2f7; padding-bottom: 10px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <button type="button" class="btn-exit-quiz" onclick="confirmExitLesson()">خروج لقائمة الدروس ⬅</button>
          <span id="currentLessonIndicator" style="font-weight: bold; color: #0b4f8a;"></span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
      </div>
      <div id="questionText" style="font-size: 18px; font-weight: bold; color: #052c52; background: #f8fbfe; padding: 16px; border-radius: 14px; border-right: 5px solid #f5a623; margin-bottom: 18px; line-height: 1.6;"></div>
      <div id="optionsBox"></div>
      <div style="text-align: center; min-height: 50px; margin-top: 15px;">
        <div id="feedbackMsg" style="font-weight: bold; font-size: 16px; margin-bottom: 8px;"></div>
        <div id="nextBtnArea"></div>
      </div>
    </div>

    <!-- 4. شاشة نتيجة الدرس -->
    <div id="lessonResultScreen" style="display: none; text-align: center; padding: 15px 0;">
      <div id="resultIcon" style="font-size: 45px; margin-bottom: 5px;">🌟</div>
      <h2 id="resultTitle" style="color: #0b4f8a; margin: 5px 0;"></h2>
      <div id="lessonScoreDisplay" style="font-size: 36px; font-weight: 900; color: #f5a623; margin: 10px 0;"></div>
      <p id="lessonPraiseDisplay" style="font-size: 17px; font-weight: bold; color: #052c52; line-height: 1.7; margin: 15px 0;"></p>
      <div id="resultButtons"></div>
    </div>

    <!-- 5. شاشة الشهادة -->
    <div id="certificateScreen" style="display: none; text-align: center; padding: 20px 0;">
      <div style="border: 5px double #f5a623; border-radius: 20px; padding: 25px 15px;">
        <div style="font-size: 42px;">🏆</div>
        <h2 style="color: #0b4f8a; margin: 8px 0;">بطاقة التميز والفخر لمادة عباداتي</h2>
        <div style="color: #627d98; font-weight: bold;" id="certSubTitle"></div>
        <div id="certStudentName" style="font-size: 26px; color: #f5a623; font-weight: 900; margin: 10px 0; text-decoration: underline;"></div>
        <div style="font-weight: bold; color: #052c52;" id="certCompletionText"></div>
        <div id="certFinalPercent" style="font-size: 32px; font-weight: 900; color: #27ae60; margin: 12px 0;"></div>
        <p style="font-weight: bold; color: #536b88; line-height: 1.8;" id="certDuaaText"></p>
      </div>
      <div style="margin-top: 20px;">
        <button type="button" class="btn" onclick="window.print()">طباعة البطاقة 🖨️</button>
        <button type="button" class="btn" style="background: #627d98;" onclick="returnToMap()">العودة للدروس</button>
      </div>
    </div>

  </div>

    var selectedGender = "boy";
    var studentName = "";
    var scores = {};
    var currentLesson = null;
    var currentLessonIndex = 0;
    var currentQIdx = 0;
    var currentLessonScore = 0;
    var autoNextTimeout = null;

    function setGender(g) {
      selectedGender = g;
      document.getElementById("genderBoy").className = "gender-btn" + (g === "boy" ? " active" : "");
      document.getElementById("genderGirl").className = "gender-btn" + (g === "girl" ? " active" : "");
    }

    function showScreen(screenId) {
      var screens = ["loginScreen", "mapScreen", "quizScreen", "lessonResultScreen", "certificateScreen"];
      for (var i = 0; i < screens.length; i++) {
        var el = document.getElementById(screens[i]);
        if (el) el.style.display = "none";
      }
      var target = document.getElementById(screenId);
      if (target) target.style.display = "block";
      window.scrollTo(0, 0);
    }

    function startAdventure() {
      var input = document.getElementById("studentNameInput");
      var name = input ? input.value.trim() : "";
      if (!name) {
        alert(selectedGender === "boy" ? "من فضلك اكتب اسمك أولاً يا بطل!" : "من فضلكِ اكتبي اسمكِ أولاً يا أميرتنا الغالية!");
        return;
      }
      studentName = name;
      renderMap();
      showScreen("mapScreen");
    }

    function confirmExitLesson() {
      var msg = selectedGender === "boy" ? 
        "هل تريد الخروج والعودة لقائمة الدروس يا بطل؟" : 
        "هل تريدين الخروج والعودة لقائمة الدروس يا أميرتنا الغالية؟";
      if (confirm(msg)) {
        if (autoNextTimeout) clearTimeout(autoNextTimeout);
        returnToMap();
      }
    }

    function renderMap() {
      var greetingEl = document.getElementById("displayGreeting");
      var nameEl = document.getElementById("displayName");
      if (greetingEl) {
        greetingEl.innerText = (selectedGender === "boy" ? "مرحباً يا بطلنا المتميز" : "مرحباً يا أميرتنا الغالية والمتميزة");
      }
      if (nameEl) nameEl.innerText = studentName;

      var grid = document.getElementById("lessonsGrid");
      if (!grid) return;
      grid.innerHTML = "";

      var completedCount = 0;

      for (var i = 0; i < lessonsData.length; i++) {
        (function(index) {
          var lesson = lessonsData[index];
          var hasScore = scores[lesson.id] !== undefined;
          var itemClass = "lesson-item";
          var statusText = "اضغط للبدء 🎯";
          var statusBadge = "⏳ متاح";

          if (hasScore) {
            completedCount++;
            var score = scores[lesson.id];
            var percent = (score / lesson.questions.length) * 100;
            if (percent >= 70) {
              itemClass += " passed";
              statusText = "درجتك: " + score + " / " + lesson.questions.length + " (" + Math.round(percent) + "%)";
              statusBadge = "✅ متميز";
            } else {
              itemClass += " need-retry";
              statusText = "درجتك: " + score + " / " + lesson.questions.length + " (" + Math.round(percent) + "%)";
              statusBadge = "🔄 يُنصح بإعادته";
            }
          }

          var card = document.createElement("div");
          card.className = itemClass;
          card.onclick = function() { startLesson(index); };

          card.innerHTML = 
            '<div>' +
              '<div style="font-size: 13px; color: #f5a623; font-weight: bold; margin-bottom: 4px;">الدرس ' + (index + 1) + '</div>' +
              '<div style="font-size: 15px; font-weight: bold; color: #052c52; margin-bottom: 8px;">' + lesson.title + '</div>' +
            '</div>' +
            '<div style="font-size: 13px; font-weight: bold; color: #7b94ad; display: flex; justify-content: space-between;">' +
              '<span>' + statusText + '</span>' +
              '<span>' + statusBadge + '</span>' +
            '</div>';
          grid.appendChild(card);
        })(i);
      }

      var certArea = document.getElementById("finalCertBtnArea");
      if (certArea) {
        if (completedCount === 8) {
          certArea.innerHTML = '<button type="button" class="btn" style="background: #27ae60; font-size: 18px;" onclick="showFinalCertificate()">🏆 استلام بطاقة التميز والفخر 🏆</button>';
        } else {
          var keepGoing = selectedGender === "boy" ? "واصل همتك يا بطل!" : "واصلي همتكِ يا أميرتنا الغالية، فخورون بأميراتنا الغاليات دائماً! 🌸";
          certArea.innerHTML = '<span style="font-size: 13px; color: #7b94ad; font-weight: bold;">أنجزتِ مراجعة ' + completedCount + ' من أصل 8 دروس. ' + keepGoing + '</span>';
        }
      }
    }

    function startLesson(lessonIndex) {
      if (autoNextTimeout) clearTimeout(autoNextTimeout);
      currentLessonIndex = lessonIndex;
      currentLesson = lessonsData[lessonIndex];
      currentQIdx = 0;
      currentLessonScore = 0;
      showScreen("quizScreen");
      renderQuestion();
    }

    function renderQuestion() {
      if (autoNextTimeout) clearTimeout(autoNextTimeout);
      var q = currentLesson.questions[currentQIdx];
      
      document.getElementById("currentLessonIndicator").innerText = currentLesson.title;
      var progressPercent = ((currentQIdx + 1) / currentLesson.questions.length) * 100;
      document.getElementById("progressBar").style.width = progressPercent + "%";

      document.getElementById("questionText").innerText = q.q;
      document.getElementById("feedbackMsg").innerText = "";
      document.getElementById("nextBtnArea").innerHTML = "";

      var box = document.getElementById("optionsBox");
      box.innerHTML = "";

      for (var i = 0; i < q.options.length; i++) {
        (function(idx) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "opt-btn";
          btn.innerText = q.options[idx];
          btn.onclick = function() { handleAnswer(idx, btn); };
          box.appendChild(btn);
        })(i);
      }
    }

    function goToNextQuestion() {
      if (autoNextTimeout) clearTimeout(autoNextTimeout);
      currentQIdx++;
      if (currentQIdx < currentLesson.questions.length) {
        renderQuestion();
      } else {
        finishLesson();
      }
    }

    function handleAnswer(selectedIdx, clickedBtn) {
      var q = currentLesson.questions[currentQIdx];
      var allBtns = document.querySelectorAll(".opt-btn");
      for (var i = 0; i < allBtns.length; i++) {
        allBtns[i].disabled = true;
      }

      var feedback = document.getElementById("feedbackMsg");
      var nextBtnArea = document.getElementById("nextBtnArea");

      var isBoy = (selectedGender === "boy");

      if (selectedIdx === q.ans) {
        clickedBtn.classList.add("correct");
        currentLessonScore++;

        var boyPraises = [
          "مبدع ورائع! بارك الله في علمك ونور قلبك 🌟",
          "أحسنتَ القول يا بطل، إجابة مسددة وصحيحة! 👏",
          "ما شاء الله تبارك الله! فتح الله عليك فتوح العارفين ✨",
          "إجابة ممتازة وذكية يا فقيهنا الصغير! 🌿"
        ];
        var girlPraises = [
          "رائعة ومبدعة يا أميرتنا الغالية! بارك الله في علمكِ ونور قلبكِ 🌟",
          "أحسنتِ القول يا أميرتنا الغالية، إجابة صحيحة ومسددة! 👏",
          "ما شاء الله تبارك الله على أميراتنا الغاليات الذكيات! فتح الله عليكِ ✨",
          "إجابة ممتازة يا أميرة الفقه الجميلة! دمتِ فخراً 🌸"
        ];
        var praises = isBoy ? boyPraises : girlPraises;
        var praise = praises[Math.floor(Math.random() * praises.length)];

        feedback.style.color = "#27ae60";
        feedback.innerText = praise;

        autoNextTimeout = setTimeout(function() {
          goToNextQuestion();
        }, 1400);

      } else {
        clickedBtn.classList.add("wrong");
        if (allBtns[q.ans]) allBtns[q.ans].classList.add("correct");
        
        var boyRetry = [
          "لا بأس يا ذكي! انظر للإجابة الصحيحة المحددة بالأخضر لتتعلم منها 🌸",
          "محاولة طيبة يا بطل! اقرأ السؤال والإجابة الصحيحة جيداً ثم اضغط التالي 💪",
          "من الأخطاء نتعلّم ونتميز! تأمل الإجابة الصحيحة ثم تابع طريقك نحو القمة ☀️"
        ];
        var girlRetry = [
          "لا بأس يا أميرتنا الغالية! انظري للإجابة الصحيحة المحددة بالأخضر لتتعلمي منها 🌸",
          "محاولة طيبة يا أميرتنا الغالية! اقرئي السؤال والإجابة الصحيحة جيداً ثم اضغطي التالي 💪",
          "أميراتنا الغاليات يتعلمن من المحاولة ليصلن للقمة دائماً! تأملي الإجابة الصحيحة وتابعي ☀️"
        ];
        var retryList = isBoy ? boyRetry : girlRetry;
        var retry = retryList[Math.floor(Math.random() * retryList.length)];

        feedback.style.color = "#e74c3c";
        feedback.innerText = retry;

        nextBtnArea.innerHTML = '<button type="button" class="btn-next-action" onclick="goToNextQuestion()">السؤال التالي ⬅</button>';
      }
    }

    function finishLesson() {
      scores[currentLesson.id] = currentLessonScore;
      showScreen("lessonResultScreen");
      var totalQ = currentLesson.questions.length;
      var percentage = (currentLessonScore / totalQ) * 100;
      var isBoy = (selectedGender === "boy");

      document.getElementById("lessonScoreDisplay").innerText = currentLessonScore + " / " + totalQ + " (" + Math.round(percentage) + "%)";

      var resultTitle = document.getElementById("resultTitle");
      var resultIcon = document.getElementById("resultIcon");
      var praiseEl = document.getElementById("lessonPraiseDisplay");
      var btnArea = document.getElementById("resultButtons");

      if (percentage >= 70) {
        resultIcon.innerText = "🌟";
        resultTitle.innerText = isBoy ? "أحسنتَ وأبدعتَ يا بطلنا المتميز! 👏" : "أحسنتِ وأبدعتِ يا أميرتنا الغالية! 👏";
        praiseEl.innerHTML = "ما شاء الله تبارك الله يا <strong>" + studentName + "</strong>!<br>" +
          (isBoy ? "لقد أتممتَ مراجعة درس (" : "لقد أتممتِ مراجعة درس (") + currentLesson.title + ") بنتيجة رائعة وهمة عالية. " +
          (isBoy ? "بارك الله في فهمك وعلمك وجعلك قرة عين لوالديك." : "بارك الله في فهمكِ وعلمكِ يا أميرتنا الغالية، وجعلكِ الله قدوة لأميراتنا الغاليات وقرة عين لوالديكِ.");
        btnArea.innerHTML = '<button type="button" class="btn" onclick="returnToMap()">متابعة الدروس 📖</button>' +
                            '<button type="button" class="btn btn-retry" onclick="startLesson(' + currentLessonIndex + ')">إعادة لزيادة الإتقان ✨</button>';
      } else {
        resultIcon.innerText = "🌱";
        resultTitle.innerText = isBoy ? "محاولة طيبة يا بطلنا الغالي!" : "محاولة طيبة يا أميرتنا الغالية!";
        praiseEl.innerHTML = (isBoy ? "حبيبي البطل <strong>" : "أميرتنا الغالية <strong>") + studentName + "</strong>.. " +
          (isBoy ? "أنت بطل ذكي ومتميز 💫<br>لكي تصبح درجاتك متألقة دائماً، ما رأيك أن تعيد مراجعة درس (" : "أنتِ أميرة ذكية ومتميزة كما عهدنا أميراتنا الغاليات 💫<br>لكي تصبح درجاتكِ متألقة دائماً، ما رأيكِ أن تعيدي مراجعة درس (") +
          currentLesson.title + (isBoy ? ") سريعاً ثم تخوض الاختبار مرة أخرى لتحسن درجتك وتصل للقمة؟ أنت قادر عليها بكل سهولة! 🌟" : ") سريعاً ثم تخوضي الاختبار مرة أخرى لتحسني درجتكِ وتصلي للقمة؟ أنتِ قادرة عليها بكل سهولة يا أميرتنا الغالية! 🌟");
        btnArea.innerHTML = '<button type="button" class="btn btn-retry" onclick="startLesson(' + currentLessonIndex + ')">' + (isBoy ? "إعادة محاولة الدرس الآن 🔁" : "إعادة محاولة الدرس الآن 🔁") + '</button>' +
                            '<button type="button" class="btn" style="background: #627d98;" onclick="returnToMap()">العودة لقائمة الدروس 📖</button>';
      }
    }

    function returnToMap() {
      if (autoNextTimeout) clearTimeout(autoNextTimeout);
      renderMap();
      showScreen("mapScreen");
    }

    function showFinalCertificate() {
      var totalEarned = 0;
      var totalPossible = 0;
      var isBoy = (selectedGender === "boy");

      for (var i = 0; i < lessonsData.length; i++) {
        var l = lessonsData[i];
        totalEarned += (scores[l.id] || 0);
        totalPossible += l.questions.length;
      }

      var percent = Math.round((totalEarned / totalPossible) * 100);

      document.getElementById("certSubTitle").innerText = isBoy ? 
        "برنامج نِبراس يهنئ البطل المتميز:" : 
        "برنامج نِبراس يهنئ أميرتنا الغالية والمتميزة:";
      document.getElementById("certStudentName").innerText = studentName;
      document.getElementById("certCompletionText").innerText = isBoy ? 
        "لإتمامه مراجعة الدروس الثمانية بنجاح وتفوق!" : 
        "لإتمامها مراجعة الدروس الثمانية بنجاح وتفوق مبهر كعادتها بين أميراتنا الغاليات!";
      document.getElementById("certFinalPercent").innerText = "النسبة الإجمالية: " + percent + "%";
      document.getElementById("certDuaaText").innerText = isBoy ? 
        "ما شاء الله لا قوة إلا بالله! زادك الله علماً وفقهاً ونوراً في قلبك، وجعلك الله قرة عين لوالديك ونبراساً يُقتدى به." :
        "ما شاء الله لا قوة إلا بالله! زادكِ الله علماً وفقهاً ونوراً في قلبكِ يا أميرتنا الغالية، وجعلكِ الله فخراً لأميراتنا الغاليات وقرة عين لوالديكِ ونبراساً يُقتدى به.";

      showScreen("certificateScreen");
    }

    window.onload = function() {
      var input = document.getElementById("studentNameInput");
      if (input) {
        input.onkeydown = function(e) {
          if (e.key === "Enter") {
            startAdventure();
          }
        };
      }
    };
  </script>
